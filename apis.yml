name: Edison Scientific
description: 'Edison Scientific is an AI research company building Kosmos, an autonomous
  "AI Scientist" for R&D teams in drug discovery and biopharma. Kosmos reads scientific
  literature, analyzes experimental data, generates and tests hypotheses, and executes
  research workflows autonomously, collaborating with scientists through tools like
  Slack and Teams. The model-agnostic platform spans the drug development lifecycle
  from target identification through clinical development and filing, learning from
  proprietary organizational and scientific data. Edison Labs publishes open science
  research including the PaperQA line of multimodal deep research agents. The company
  is backed by Spark Capital and maintains an enterprise Trust Center with SOC 2 Type
  II and ISO 27001 posture. No public developer API is published at this time.'
